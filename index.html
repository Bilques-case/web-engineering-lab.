<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Engineering</title>
  </head>

  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
      <h1 id="greeting">Welcome to Web Engineering</h1>

      <nav>
        <ul>
          <li>
            <a href="#schedule" aria-current="location">Office Hours</a>
          </li>
          <li>
            <a href="#feedback">Send Feedback</a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <!-- Office Hours Section -->
      <section id="schedule">
        <h2>Office Hours</h2>

        <figure>
          <svg
            role="img"
            aria-labelledby="pin-title"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <title id="pin-title">Location pin</title>

            <circle cx="12" cy="10" r="5"></circle>

            <path
              d="M12 2C7 2 4 6 4 10c0 6 8 12 8 12s8-6 8-12c0-4-3-8-8-8z"
            ></path>
          </svg>

          <figcaption>All office hours are held in Room 214.</figcaption>
        </figure>

        <table>
          <caption>
            Weekly office hours
          </caption>

          <thead>
            <tr>
              <th scope="col">Day</th>
              <th scope="col">Time</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>Monday</td>
              <td>
                <time datetime="10:00">10:00</time> –
                <time datetime="11:00">11:00</time>
              </td>
            </tr>

            <tr>
              <td>Wednesday</td>
              <td>
                <time datetime="13:00">13:00</time> –
                <time datetime="14:00">14:00</time>
              </td>
            </tr>

            <tr>
              <td>Friday</td>
              <td>
                <time datetime="11:00">11:00</time> –
                <time datetime="12:00">12:00</time>
              </td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- Decorative Divider -->
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="#0b3d91"></circle>
      </svg>

      <!-- Feedback Section -->
      <section id="feedback">
        <h2>Send Feedback</h2>

        <form>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            aria-describedby="email-hint"
          />

          <span id="email-hint"> We will only use this to reply to you. </span>

          <fieldset>
            <legend>Topic</legend>

            <label>
              <input type="radio" name="topic" value="course" required />
              Course
            </label>

            <label>
              <input type="radio" name="topic" value="lab" />
              Lab
            </label>

            <label>
              <input type="radio" name="topic" value="other" />
              Other
            </label>
          </fieldset>

          <label for="message">Message</label>

          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit">Send Feedback</button>
        </form>
      </section>
    </main>

    <footer>
      <address>Contact your instructor for help.</address>
    </footer>
  </body>
</html>
